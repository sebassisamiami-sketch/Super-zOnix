[package]
name = "zonix-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "zOnix always-on audio engine daemon (PipeWire graph manager + IPC server)"

[[bin]]
name = "zonixd"
path = "src/main.rs"

[features]
# Default builds use the in-memory stub engine and compile on ANY machine,
# even without PipeWire headers (handy for CI, the GUI dev loop, and tests).
default = []
# The real backend. Requires the `pipewire-devel` system package at build time
# (see docs/ARCHITECTURE.md). Enable with: cargo build --features pipewire-backend
pipewire-backend = ["dep:pipewire"]

[dependencies]
zonix-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }

# Real PipeWire bindings (libpipewire-0.3). Optional: only pulled in when the
# `pipewire-backend` feature is enabled. `pipewire` re-exports `libspa` as
# `pipewire::spa`, so no separate libspa dependency is needed.
pipewire = { version = "0.8", optional = true }
