[package]
name = "zonix-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "zOnix always-on audio engine daemon (PipeWire graph manager + IPC server)"

[[bin]]
name = "zonixd"
path = "src/main.rs"

[dependencies]
zonix-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }

# NOTE (Phase 2): the PipeWire integration will add:
#   pipewire = "0.8"      # libpipewire-0.3 bindings
#   libspa   = "0.8"
# These require the `pipewire-devel` system package (see docs/ARCHITECTURE.md).
# They are intentionally NOT enabled yet so the Phase 1 scaffold builds on any
# machine without PipeWire headers installed.
