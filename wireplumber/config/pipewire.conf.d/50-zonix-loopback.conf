# zOnix virtual sinks — PipeWire config drop-in.
#
# This file creates the four zOnix mixing lanes as real, audible virtual sinks
# using libpipewire-module-loopback. Each loopback instance is:
#
#   * an Audio/Sink named `zonix.sink.<role>` that applications can target, and
#   * a playback stream that mixes that sink's audio into the *default* output
#     device (headphones/speakers). Because no explicit `node.target` is set on
#     the playback side, WirePlumber routes it to whatever the current default
#     sink is — so the lanes automatically follow your output device.
#
# The zonixd daemon then discovers these sinks by name and controls their
# volume / mute / per-app routing over the native PipeWire API.
#
# INSTALL (per-user, no root):
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp wireplumber/config/pipewire.conf.d/50-zonix-loopback.conf \
#      ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse wireplumber
#
# (The scripts/install-config.sh helper does exactly this.)

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "zOnix Game"
            capture.props = {
                node.name        = "zonix.sink.game"
                node.description = "zOnix Game"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                # Advertise a friendly icon/role for mixers.
                node.nick        = "Game"
            }
            playback.props = {
                node.name        = "zonix.sink.game.out"
                media.class      = Stream/Output/Audio
                audio.position   = [ FL FR ]
                # No node.target -> follows the default output device.
                stream.dont-remix = false
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "zOnix Chat"
            capture.props = {
                node.name        = "zonix.sink.chat"
                node.description = "zOnix Chat"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                node.nick        = "Chat"
            }
            playback.props = {
                node.name        = "zonix.sink.chat.out"
                media.class      = Stream/Output/Audio
                audio.position   = [ FL FR ]
                stream.dont-remix = false
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "zOnix Media"
            capture.props = {
                node.name        = "zonix.sink.media"
                node.description = "zOnix Media"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                node.nick        = "Media"
            }
            playback.props = {
                node.name        = "zonix.sink.media.out"
                media.class      = Stream/Output/Audio
                audio.position   = [ FL FR ]
                stream.dont-remix = false
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "zOnix System"
            capture.props = {
                node.name        = "zonix.sink.system"
                node.description = "zOnix System"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
                node.nick        = "System"
            }
            playback.props = {
                node.name        = "zonix.sink.system.out"
                media.class      = Stream/Output/Audio
                audio.position   = [ FL FR ]
                stream.dont-remix = false
            }
        }
    }
]
